[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Cron job for daily predictions (weekdays at 7:30 AM ET)
[[cron]]
schedule = "30 12 * * 1-5"  # Monday-Friday at 12:30 UTC (7:30 AM ET)
command = "npm run daily-predictions"
timeout = 600  # 10 minutes

# Cron job for grading predictions (weekdays at 9:15 PM ET)
[[cron]]
schedule = "45 2 * * 1-5"  # Monday-Friday at 2:45 UTC (9:45 PM ET, buffer for 4:15 PM ET close)
command = "npm run check-accuracy"
timeout = 300  # 5 minutes
